# Render Blueprint —— 静态站点
# 用法：Render 控制台 → New → Blueprint → 选本仓库，即可自动创建
services:
  - type: web
    name: sanxian-shouzuo
    runtime: static
    # 纯静态，无需构建
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /admin
        destination: /index.html
